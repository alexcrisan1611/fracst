[workspace]
resolver = "3"
members = ["crates/fracst-core", "crates/fracst-cli", "crates/fracst", "crates/fracst-cuda", "crates/fracst-remote", "crates/fracst-server", "crates/fracst-video"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexcrisan1611/fracst"

[workspace.dependencies]
fracst-core = { path = "crates/fracst-core" }
rayon = "1.12"
png = "0.18"
clap = { version = "4.6", features = ["derive"] }
eframe = "0.37"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# Tests exercise the high-precision maths heavily; keep them reasonably fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
