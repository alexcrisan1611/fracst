[package]
name = "fracst"
description = "Interactive deep-zoom Mandelbrot explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fracst-core.workspace = true
fracst-remote = { path = "../fracst-remote" }
fracst-video = { path = "../fracst-video" }
rayon.workspace = true
eframe.workspace = true
rfd.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
