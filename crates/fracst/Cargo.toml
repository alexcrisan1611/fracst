[package]
name = "fracst"
description = "Interactive deep-zoom Mandelbrot explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fracst-core.workspace = true
fracst-remote = { path = "../fracst-remote" }
