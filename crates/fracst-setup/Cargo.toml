[package]
name = "fracst-setup"
description = "The Windows installer's front end: installs or updates Fracst through the Inno Setup engine it carries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(windows)'.dependencies]
fracst-core.workspace = true
# The light OpenGL renderer and no bundled fallback fonts (Inter covers
# every screen): wgpu would more than double the download.
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit"] }
rfd.workspace = true
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
