name: Release

# Pushing a tag like v0.1.0 builds Linux, Windows and macOS packages and
# publishes them as a GitHub release. Running the workflow by hand builds
# the same packages as artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Smaller downloads: no debug info or symbol tables in release packages.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            # The oldest supported image, for the widest glibc compatibility.
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Optional repository variable: the gateway address the app suggests.
      FRACST_DEFAULT_REMOTE_URL: ${{ vars.FRACST_DEFAULT_REMOTE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          # Installers need a plain number: the crate version.
          echo "PKG_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_ENV"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --release --locked -p fracst -p fracst-cli -p fracst-server
          # A tarball with an install script, for any distribution...
          dist="fracst-$VERSION-linux-x86_64"
          mkdir "$dist"
          cp target/release/fracst target/release/fracst-cli target/release/fracst-server README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          cp packaging/linux/install.sh packaging/linux/fracst.desktop packaging/linux/fracst.xml "$dist/"
          cp assets/icon.png "$dist/fracst.png"
          tar czf "$dist.tar.gz" "$dist"
          # ...and a .deb for Debian, Ubuntu and their relatives.
          deb="debian-root"
          install -Dm755 -t "$deb/usr/bin" target/release/fracst target/release/fracst-cli target/release/fracst-server
          install -Dm644 packaging/linux/fracst.desktop "$deb/usr/share/applications/fracst.desktop"
          install -Dm644 packaging/linux/fracst.xml "$deb/usr/share/mime/packages/fracst.xml"
          install -Dm644 assets/icon.png "$deb/usr/share/icons/hicolor/512x512/apps/fracst.png"
          install -Dm644 -t "$deb/usr/share/doc/fracst" README.md LICENSE-MIT LICENSE-APACHE
          mkdir -p "$deb/DEBIAN"
          cat > "$deb/DEBIAN/control" <<CONTROL
          Package: fracst
          Version: $PKG_VERSION
          Architecture: amd64
          Maintainer: Alex Crișan <alexcrisan1611@users.noreply.github.com>
          Depends: libc6 (>= 2.35), libgcc-s1
          Recommends: libvulkan1 | libgl1, libxkbcommon0, xdg-desktop-portal
          Section: graphics
          Priority: optional
          Homepage: https://github.com/alexcrisan1611/fracst
          Description: Fast deep-zoom Mandelbrot explorer
           fracst explores the Mandelbrot set to extreme zooms, with a
           command-line renderer (fracst-cli) and a render server for remote
           GPUs (fracst-server).
          CONTROL
          dpkg-deb --build --root-owner-group "$deb" "fracst-$VERSION-linux-amd64.deb"

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p fracst -p fracst-cli -p fracst-server
          # A portable zip...
          dist="fracst-$VERSION-windows-x86_64"
          mkdir "$dist"
          cp target/release/fracst.exe target/release/fracst-cli.exe target/release/fracst-server.exe README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          7z a "$dist.zip" "$dist"
          # ...and an installer (Inno Setup comes with the runner image).
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" -Q \
            "-DAppVersion=$PKG_VERSION" "-DSourceDir=$(cygpath -w "$PWD/target/release")" \
            "-DOutputBase=fracst-$VERSION-windows-x86_64-setup" "-O$(cygpath -w "$PWD")" \
            packaging/windows/fracst.iss

      - name: Build and package (macOS, universal)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p fracst -p fracst-cli
          done
          dist="fracst-$VERSION-macos-universal"
          contents="$dist/fracst.app/Contents"
          mkdir -p "$contents/MacOS" "$contents/Resources"
          lipo -create -output "$contents/MacOS/fracst" target/{aarch64,x86_64}-apple-darwin/release/fracst
          lipo -create -output "$dist/fracst-cli" target/{aarch64,x86_64}-apple-darwin/release/fracst-cli
          cp assets/icon.icns "$contents/Resources/fracst.icns"
          sed "s/@VERSION@/$PKG_VERSION/g" .github/macos/Info.plist > "$contents/Info.plist"
          cp README.md LICENSE-MIT LICENSE-APACHE "$dist/"
          # Ad-hoc signatures: not notarised, but required to run on Apple Silicon.
          codesign --force --deep --sign - "$dist/fracst.app"
          codesign --force --sign - "$dist/fracst-cli"
          ditto -c -k --keepParent "$dist" "$dist.zip"
          # A disk image to drag the app into Applications.
          dmg="dmg-root"
          mkdir "$dmg"
          ditto "$dist/fracst.app" "$dmg/fracst.app"
          ln -s /Applications "$dmg/Applications"
          hdiutil create -volname fracst -srcfolder "$dmg" -fs HFS+ -format UDZO -ov "$dist.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            fracst-*.tar.gz
            fracst-*.deb
            fracst-*.zip
            fracst-*.exe
            fracst-*.dmg
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "fracst ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag
